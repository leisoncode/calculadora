<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculadora">
        <div id="pantalla">0</div>
        <div class="teclas">
            <button class="especial" data-accion="limpiar">C</button>
            <button class="especial" data-accion="borrar">⌫</button>
            <button class="operador" data-valor="/">÷</button>
            <button class="operador" data-valor="*">x</button>

            <button data-valor="7">7</button>
            <button data-valor="8">8</button>
            <button data-valor="9">9</button>
            <button class="operador" data-valor="-">-</button>

            <button data-valor="4">4</button>
            <button data-valor="5">5</button>
            <button data-valor="6">6</button>
            <button class="operador" data-valor="+">+</button>

            <button data-valor="1">1</button>
            <button data-valor="2">2</button>
            <button data-valor="3">3</button>
            <button class="igual" data-accion="calcular">=</button>

            <button class="cero" data-valor="0">0</button>
            <button data-valor=".">.</button>
        </div>

    </main>
    <script src="script.js"></script>
    
</body>
</html>
